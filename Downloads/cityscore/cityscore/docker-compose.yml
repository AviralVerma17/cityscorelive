version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cityscore-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    environment:
      - ALLOWED_ORIGINS=http://localhost:8080
    volumes:
      - cityscore-db:/app/data

  frontend:
    image: nginx:alpine
    container_name: cityscore-frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  cityscore-db:
